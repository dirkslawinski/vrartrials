<!DOCTYPE html>
<html>
  <head>
    <title>Cardboard Passthrough VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      /* Style for the permission button */
      #ui-overlay {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
      button {
        padding: 20px 40px;
        font-size: 1.2rem;
        background: #ed213a;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="ui-overlay">
      <button id="start-btn">ENABLE CAMERA</button>
    </div>

    <a-scene xr-mode-ui="enabled: true">
      <a-assets>
        <video id="webcam" playsinline autoplay muted crossorigin="anonymous"></video>
      </a-assets>

      <a-entity id="rig">
        <a-camera position="0 0 0" look-controls="enabled: true" wasd-controls-enabled="false">
          <a-video 
            src="#webcam" 
            width="4" height="2.25" 
            position="0 0 -1.5">
          </a-video>
        </a-camera>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#webcam');
      const btn = document.querySelector('#start-btn');

      btn.addEventListener('click', () => {
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        navigator.mediaDevices.getUserMedia(constraints)
          .then((stream) => {
            video.srcObject = stream;
            video.play();
            document.getElementById('ui-overlay').style.display = 'none';
          })
          .catch((err) => {
            alert("Error accessing camera. Ensure you are on HTTPS.");
            console.error(err);
          });
      });
    </script>
  </body>
</html>
