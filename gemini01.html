<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #start-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
        padding: 15px;
        background: #222;
        color: white;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <button id="start-btn">Start Camera</button>

    <a-scene>
      <a-assets>
        <video id="webcam" playsinline autoplay muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" wasd-controls-enabled="false">
        <a-video 
          src="#webcam" 
          width="16" height="9" 
          position="0 0 -10">
        </a-video>
      </a-camera>
    </a-scene>

    <script>
      const video = document.querySelector('#webcam');
      const btn = document.querySelector('#start-btn');

      btn.addEventListener('click', () => {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const constraints = {
            video: {
              facingMode: 'environment', // Specifically requests the back camera
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          };

          navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
              video.srcObject = stream;
              // Crucial: Manually call play() after the stream is attached
              video.play();
              // Hide the button once the camera is active
              btn.style.display = 'none';
            })
            .catch((err) => {
              console.error("Camera error:", err);
              alert("Camera error: " + err.name);
            });
        } else {
          alert("Webcam API not supported in this browser.");
        }
      });
    </script>
  </body>
</html>
