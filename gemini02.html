<!DOCTYPE html>
<html>
  <head>
    <title>Forced Cardboard Split-Screen</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 9999;
      }
      button { padding: 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="start-btn">1. Start Camera</button>
    </div>

    <a-scene background="color: black" stats>
      <a-assets>
        <video id="webcam" playsinline autoplay muted crossorigin="anonymous"></video>
      </a-assets>

      <a-entity id="left-eye" camera="active: true" position="-0.03 0 0" look-controls>
        <a-video src="#webcam" width="16" height="9" position="0 0 -10"></a-video>
      </a-entity>

      <a-entity id="right-eye" camera="active: true" position="0.03 0 0" look-controls>
        <a-video src="#webcam" width="16" height="9" position="0 0 -10"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#webcam');
      const btn = document.querySelector('#start-btn');

      // Manual Camera Setup
      btn.addEventListener('click', () => {
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: 1280, height: 720 } 
        })
        .then(stream => {
          video.srcObject = stream;
          video.play();
          btn.style.display = 'none';
          setupViewports();
        });
      });

      function setupViewports() {
        const sceneEl = document.querySelector('a-scene');
        
        // This force-injects the renderer settings for split screen
        sceneEl.addEventListener('render-target-loaded', () => {
          const renderer = sceneEl.renderer;
          renderer.setScissorTest(true);
        });

        sceneEl.addEventListener('render-tick', () => {
          const renderer = sceneEl.renderer;
          const size = new THREE.Vector2();
          renderer.getSize(size);

          const leftCamera = document.querySelector('#left-eye').components.camera.camera;
          const rightCamera = document.querySelector('#right-eye').components.camera.camera;

          // Render Left Eye
          renderer.setViewport(0, 0, size.x / 2, size.y);
          renderer.setScissor(0, 0, size.x / 2, size.y);
          renderer.render(sceneEl.object3D, leftCamera);

          // Render Right Eye
          renderer.setViewport(size.x / 2, 0, size.x / 2, size.y);
          renderer.setScissor(size.x / 2, 0, size.x / 2, size.y);
          renderer.render(sceneEl.object3D, rightCamera);
        }, false);
      }
    </script>
  </body>
</html>
