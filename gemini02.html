<!DOCTYPE html>
<html>
<head>
    <title>Manual Cardboard Passthrough</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; }
        
        /* The two viewports */
        .viewport {
            width: 50vw;
            height: 100vh;
            object-fit: cover;
            border-right: 1px solid #222; /* Center line for alignment */
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Hide the source video element */
        #sourceVideo { display: none; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="btn">Start Passthrough</button>
    </div>

    <video id="sourceVideo" autoplay playsinline muted></video>

    <canvas id="leftEye" class="viewport"></canvas>
    <canvas id="rightEye" class="viewport"></canvas>

    <script>
        const video = document.getElementById('sourceVideo');
        const leftCanvas = document.getElementById('leftEye');
        const rightCanvas = document.getElementById('rightEye');
        const leftCtx = leftCanvas.getContext('2d');
        const rightCtx = rightCanvas.getContext('2d');
        const btn = document.getElementById('btn');

        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                btn.style.display = 'none';
                
                // Initialize drawing loop
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Camera error:", err);
            }
        };

        function render() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Set canvas internal resolution to match display size
                if (leftCanvas.width !== leftCanvas.clientWidth) {
                    leftCanvas.width = rightCanvas.width = leftCanvas.clientWidth;
                    leftCanvas.height = rightCanvas.height = leftCanvas.clientHeight;
                }

                // Draw to Left Eye
                drawFrame(leftCtx, leftCanvas);
                // Draw to Right Eye
                drawFrame(rightCtx, rightCanvas);
            }
            requestAnimationFrame(render);
        }

        function drawFrame(ctx, canvas) {
            // Calculate scale to "Cover" the viewport while maintaining aspect ratio
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;
            let drawWidth, drawHeight, offsetX, offsetY;

            if (videoRatio > canvasRatio) {
                drawHeight = canvas.height;
                drawWidth = canvas.height * videoRatio;
                offsetX = -(drawWidth - canvas.width) / 2;
                offsetY = 0;
            } else {
                drawWidth = canvas.width;
                drawHeight = canvas.width / videoRatio;
                offsetX = 0;
                offsetY = -(drawHeight - canvas.height) / 2;
            }

            ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight);
        }
    </script>
</body>
</html>
